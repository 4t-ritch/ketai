[package]
name = "ketai"
version = "0.1.0"
edition = "2024"

[dependencies]
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "flac",
  "mp3",
  "mp4",
  "vorbis",
  "wav",
  "symphonia-alac",
  "symphonia-simd",
] }

stream-download = { version = "0.24", default-features = false, features = [
  "http",
  "reqwest",
  "reqwest-rustls",
  "temp-storage",
  "process",
  "registry",
] }

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "sync",
  "time",
] }

thiserror = "2"
directories = "6.0.0"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis", "wav", "pcm"] }
symphonia-adapter-libopus = "0.2.9"
symphonia-adapter-fdk-aac = "0.1.3"
