# Configuracion de ketai: ~/.config/ketai/config.toml
# Los cambios se aplican al guardar, sin reiniciar.

[theme]
# true: toda la interfaz toma los colores de la caratula que suena y los
# colores de abajo se ignoran. false: solo valen los colores de abajo.
# Sin esta linea, cada color decide ("cover" o "#rrggbb").
# cover_color = true

# "cover": el color sale de la caratula que suena. O un color fijo "#rrggbb".
background = "cover"
accent = "cover"

# Colores fijos (descomentar para cambiarlos).
# foreground = "#ffffff"
# dim = "#c8d3e0"
# faint = "#7f8ea3"
# raised = "#1c2a3a"
# on_accent = "#04121f"
# row = "#16202e"
# ok = "#7ee787"
# error = "#ff7b8a"
# spectrum_top = "#ff7ab6"

[keys]
# Atajos globales: una tecla o una lista. Lo que no se pone queda por defecto.
# Ver docs/config.md para la lista de acciones.
# actions = "ctrl+p"
# toggle = "space"
# next = ["n", "ctrl+right"]

[playlists]
# Carpeta de las playlists (.m3u8). Por defecto XDG_MUSIC_DIR/playlists
# (~/music/playlists). Se crea si no existe.
# dir = "~/music/playlists"
