# vim style. h / j / k / l are already used to move inside lists and to
# change view in Library, so the global shortcuts use Alt.
# See examples/keys/README.md.

[keys]
seek_back = ["left", "alt+h"]
seek_forward = ["right", "alt+l"]
volume_down = ["-", "alt+j"]
volume_up = ["+", "alt+k"]
next = ["n", "alt+n"]
previous = ["p", "alt+p"]
actions = ["ctrl+p", ":"]
quit = ["q", "alt+q"]
