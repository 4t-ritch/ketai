# Example ketai configuration, with every section.
#
# Copy this file to ~/.config/ketai/config.toml and change what you want.
# Changes apply when you save, without closing ketai. If something is badly
# written, ketai shows it on the last row of the screen and keeps the previous
# configuration until you fix it.
#
# More detail (each guide also has a Spanish version, README.es.md):
#   colors .......... examples/theme/README.md
#   shortcuts ....... examples/keys/README.md
#   every key ....... docs/config.md


# --- Colors ------------------------------------------------------------

[theme]
# true: the whole interface takes the colors of the playing cover, and the
# colors below are ignored. It changes with every song.
# false: only the colors below count.
# Without this line: each color decides ("cover" or a fixed color).
cover_color = true
# true: texts and controls take the cover's hue too. false: white and grey.
ui_text_cover_color = true

# These are used with cover_color = false (or without cover_color). "cover"
# takes the color from the cover; otherwise, a fixed color "#rrggbb".
background = "cover"
accent = "cover"
foreground = "#ffffff"
dim = "#c8d3e0"
faint = "#7f8ea3"
raised = "#1c2a3a"
on_accent = "#04121f"
row = "#16202e"
ok = "#7ee787"
error = "#ff7b8a"
spectrum_top = "#ff7ab6"


# --- Shortcuts ---------------------------------------------------------

[keys]
# Each action takes a key or a list. What you set replaces that action's
# default keys; actions not listed here keep their usual key. Ctrl+C always
# quits.
toggle = "space"
next = ["n", "ctrl+right"]
previous = ["p", "ctrl+left"]
seek_forward = "right"
seek_back = "left"
volume_up = ["+", "="]
volume_down = "-"
mute = "m"
shuffle = "s"
repeat = "r"
devices = "d"
folders = "f"
favorite = "*"
add_to_playlist = "P"
actions = "ctrl+p"
quit = "q"


# --- Terminal ----------------------------------------------------------

[terminal]
# true: redraw everything (and send the covers again) when the terminal gets
# the focus back. Only needed if your multiplexer erases the panel when you
# switch tabs.
redraw_on_focus = false


# --- Playlists ---------------------------------------------------------

[playlists]
# Folder where ketai copies each playlist as a .m3u8 file (to use them with
# other players). Default: the system music folder (XDG_MUSIC_DIR) +
# /playlists. It is created if missing.
dir = "~/music/playlists"
