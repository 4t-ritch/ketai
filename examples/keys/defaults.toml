# Every global shortcut with its default value.
# Copy this section to ~/.config/ketai/config.toml and change what you want.
# See examples/keys/README.md.

[keys]
toggle = "space"
next = "n"
previous = "p"
seek_forward = "right"
seek_back = "left"
volume_up = ["+", "="]
volume_down = "-"
mute = "m"
shuffle = "s"
repeat = "r"
devices = "d"
folders = "f"
favorite = "*"
add_to_playlist = "P"
actions = "ctrl+p"
quit = "q"
next_tab = "tab"
prev_tab = "shift+tab"
tab_now_playing = "1"
tab_lyrics = "2"
tab_library = "3"
tab_search = "4"
# Lyrics view only.
lyrics_layer = "o"
lyrics_translation = "t"
lyrics_offset_down = "["
lyrics_offset_up = "]"
lyrics_mode = "k"
lyrics_estimate = "w"
# Now Playing only (queue).
queue_move_up = "K"
queue_move_down = "J"
queue_remove = "x"
queue_add_to_playlist = "a"
