[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/4t-ritch/ketai"

[workspace.dependencies]
ketai-core = { path = "crates/ketai-core", version = "0.3.0" }
ketai-protocol = { path = "crates/ketai-protocol", version = "0.3.0" }
ketai-tui = { path = "crates/ketai-tui", version = "0.3.0" }
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "flac",
  "mp3",
  "mp4",
  "vorbis",
  "wav",
  "symphonia-alac",
  "symphonia-simd",
] }
symphonia = { version = "0.5", default-features = false, features = [
  "flac", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis", "wav", "pcm",
] }
symphonia-adapter-libopus = "0.2.9"
symphonia-adapter-fdk-aac = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6.0.0"

# Menos info de debug en desarrollo: reduce mucho el tamano de target/.
[profile.dev]
debug = "line-tables-only"

# Las dependencias (decodificar imagenes y audio) compiladas con
# optimizacion aun en debug: sin esto `cargo run` decodifica una caratula en
# ~200 ms en vez de ~12 ms. El codigo propio sigue en debug.
[profile.dev.package."*"]
opt-level = 2

# Binarios mas chicos: sin simbolos de depuracion, con optimizacion entre
# crates (LTO) y en una sola unidad. Compilar en release tarda mas. No se usa
# panic = "abort": un panic en un hilo del daemon cerraria todo el proceso.
[profile.release]
strip = true
lto = true
codegen-units = 1
