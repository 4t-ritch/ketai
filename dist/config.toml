# ketai configuration: ~/.config/ketai/config.toml
# Changes apply when you save, without restarting.
# Guides (English and Spanish): examples/ and docs/config.md.

[theme]
# true: the whole interface takes the colors of the playing cover and the
# colors below are ignored. false: only the colors below count.
# Without this line, each color decides ("cover" or "#rrggbb").
# cover_color = true

# "cover": the color comes from the playing cover. Or a fixed color "#rrggbb".
background = "cover"
accent = "cover"

# Fixed colors (uncomment to change them).
# foreground = "#ffffff"
# dim = "#c8d3e0"
# faint = "#7f8ea3"
# raised = "#1c2a3a"
# on_accent = "#04121f"
# row = "#16202e"
# ok = "#7ee787"
# error = "#ff7b8a"
# spectrum_top = "#ff7ab6"

[keys]
# Global shortcuts: one key or a list. What is not set keeps its default.
# See docs/config.md for the list of actions.
# actions = "ctrl+p"
# toggle = "space"
# next = ["n", "ctrl+right"]

[playlists]
# Playlists folder (.m3u8). Default XDG_MUSIC_DIR/playlists
# (~/music/playlists). It is created if missing.
# dir = "~/music/playlists"
