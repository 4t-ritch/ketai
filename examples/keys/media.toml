# Playback with Ctrl, Alt and arrows, no plain letters: useful if you type a
# lot in Search or do not want to touch playback by accident.
# See examples/keys/README.md.

[keys]
toggle = "alt+space"
next = "ctrl+right"
previous = "ctrl+left"
seek_forward = "alt+right"
seek_back = "alt+left"
volume_up = "ctrl+up"
volume_down = "ctrl+down"
mute = "alt+m"
shuffle = "alt+s"
repeat = "alt+r"
